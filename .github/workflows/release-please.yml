name: Release Please

# Owns versioning + changelog + cutting the release. On every push to main it
# maintains a "release PR" that bumps the version across Cargo.toml,
# src-tauri/tauri.conf.json and package.json and rolls up the CHANGELOG from
# Conventional Commits. Merging that PR creates the GitHub Release + `v*` tag,
# which is what triggers the distinct build/sign stage in release.yml.
#
# The release is created with a GitHub App token (not the default
# GITHUB_TOKEN) on purpose: a release created by GITHUB_TOKEN does NOT emit a
# `release` event, so release.yml would never fire. The App token makes the
# `release: published` event fire normally.
#
# Lockfiles are bumped by the `extra-files` entries in
# .release-please-config.json, not by running a package manager. There is no
# hook for that and there cannot be one: this Action never checks out a working
# tree — it builds the new file contents in memory and commits them through the
# GitHub API (code-suggester -> Octokit), so `npm install` and `cargo update`
# have nothing to run against. release-please's own first-party lockfile
# support works the same way (updaters/node/package-lock-json.js sets
# `version` and `packages[""].version`; updaters/rust/cargo-lock.js rewrites
# each workspace member's `version` in place), and for a version-only bump that
# is byte-for-byte what the package managers would have produced. The
# `simple` release-type does not wire those updaters up, so the config
# expresses the same rewrites through the generic json/toml ones.
#
# 0.1.4 shipped with both lockfiles still on the previous version because they
# were not listed at all. `just lockfile-versions` now fails the build if a
# lockfile falls out of step with its manifest, so the next omission is caught
# on the release PR rather than discovered in a later diff.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.REPOSITORY_BUTLER_APP_ID }}
          private-key: ${{ secrets.REPOSITORY_BUTLER_PEM }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
