name: AUR

# Publish packaging/aur to the AUR, so `yay -S rusted-claude-meter` tracks
# releases. Per *release* only: the PKGBUILD points at the tagged tarball, so
# nothing about it changes between tags.
#
# Two jobs, split where the retry boundary is: `build` computes the PKGBUILD
# (pkgver, sha256sums, .SRCINFO) and proves it still builds, `publish` pushes
# over SSH to a third-party host and opens a PR against a protected branch.
# The second is where the failures happen and the first is what they used to
# cost — fused, every retry of a bad push paid for the compile again. The
# computed files cross between them as an artifact, so re-running the failed
# job re-runs the push alone.
#
# Its own workflow rather than a job in release.yml because it never needed
# anything that workflow produces, only its tag — which also makes it
# dispatchable on its own, without release.yml's macOS jobs behind it.
#
# packaging/aur/README.md has the rest: why each computed value cannot be
# hand-maintained, and the two ways to retry a failed push.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.7"
        required: true
        type: string
      verify:
        description: "Build the package with makepkg before publishing"
        required: false
        default: true
        type: boolean
    secrets:
      # Enforced, not decorative: the caller names these three rather than
      # passing `secrets: inherit`, so this list is the whole set of secrets
      # the workflow can see — and adding a fourth use means adding it here.
      AUR_SSH_PRIVATE_KEY:
        # Genuinely optional: without it the whole thing skips and the release
        # still ships, like the Apple secrets in release.yml.
        required: false
      # Required, unlike the key above, because there is no skip path for
      # them: they are read *after* the AUR push has landed, so missing them
      # fails the run half-published rather than degrading.
      REPOSITORY_BUTLER_APP_ID:
        required: true
      REPOSITORY_BUTLER_PEM:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.7"
        required: true
        type: string
      verify:
        description: "Build the package with makepkg first (slow). Turn off to retry a push whose build already passed."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Serialised, never cancelled: two runs racing would push to the same AUR repo,
# and losing a half-finished publish is worse than waiting for one.
concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  build:
    name: Compute and build the package
    runs-on: ubuntu-latest
    # x86_64 on purpose: the package is arch=('x86_64'), so makepkg runs
    # natively here and the build is a real check rather than a smoke test
    # under emulation.
    timeout-minutes: 45
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      # A step rather than a job of its own: the `secrets` context is not
      # available in a job-level `if:`, but it is in a step, and a job output
      # carries the answer to `publish` from there.
      - name: Check for the AUR key
        id: gate
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          # Bare version, for the places that want 0.1.4 rather than v0.1.4 —
          # workflow expressions cannot strip the prefix themselves.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "no AUR_SSH_PRIVATE_KEY — skipping AUR publish" >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # Arch tooling via docker rather than a job-level `container:`, because
      # the Arch image has no node and GitHub's JS actions (checkout, etc.)
      # cannot run without one.
      #
      # makepkg refuses to run as root, hence the builder user; the uid is
      # matched to the runner's so the bind-mounted files stay writable.
      #
      # One container for both halves on purpose: the image is ~300 MB and the
      # `-Syu` ahead of it is the larger cost again, so a second `docker run`
      # for the build would pay both twice — and would be a second copy of the
      # preamble below to keep in step.
      - name: Refresh pkgver, checksums and .SRCINFO, then build it
        if: steps.gate.outputs.enabled == 'true'
        env:
          TAG: ${{ inputs.tag }}
          VERIFY: ${{ inputs.verify }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work/packaging/aur \
            -e "VERSION=${TAG#v}" -e "VERIFY=$VERIFY" -e "HOST_UID=$(id -u)" \
            docker.io/library/archlinux:base-devel bash -euo pipefail -c '
              # Landlock is unavailable on the runner kernel; without this every
              # pacman call dies in its download sandbox.
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf

              # The build toolchain is worth installing only if we are going to
              # build; refreshing the metadata needs updpkgsums and nothing
              # else. Never -Sy: a partial upgrade is unsupported on Arch, and
              # the resulting glibc/icu skew breaks the build spuriously.
              packages=(pacman-contrib)
              if [ "$VERIFY" = "true" ]; then
                packages+=(git nodejs npm rust webkit2gtk-4.1
                           libayatana-appindicator librsvg gtk3 openssl xdotool)
              fi
              pacman -Syu --noconfirm --needed "${packages[@]}"

              useradd -u "$HOST_UID" -m builder 2>/dev/null || useradd -m builder
              chown -R builder /work

              sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
              # pkgrel counts rebuilds of one version, so a new version resets it.
              sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
              sudo -u builder updpkgsums
              sudo -u builder makepkg --printsrcinfo > .SRCINFO

              # An AUR package that fails to build is worse than one that lags,
              # and this is the only x86_64 check the package gets.
              if [ "$VERIFY" = "true" ]; then
                sudo -u builder makepkg -f --noconfirm
              fi
            '
          echo "--- PKGBUILD/.SRCINFO after refresh ---"
          grep -E '^(pkgver|pkgrel|sha256sums)' packaging/aur/PKGBUILD

      # include-hidden-files: .SRCINFO is a dotfile, and upload-artifact drops
      # those silently by default — which would leave `publish` pushing a
      # PKGBUILD with no matching .SRCINFO, the one file pacman clients
      # actually read.
      - name: Upload the computed package files
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aur-package
          path: |
            packaging/aur/PKGBUILD
            packaging/aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The failure-prone half, and the only one worth retrying on its own: an SSH
  # push to a third-party host, then a PR against a protected branch. Re-running
  # this job alone re-uses the artifact `build` uploaded, so a retry costs a
  # minute rather than a rebuild.
  publish:
    name: Push to the AUR
    needs: build
    # `build` succeeds either way when the key is absent, so the gate is read
    # here rather than inferred from its result.
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The build check is the only x86_64 exercise the package gets, so a run
      # that skipped it says so in the run's own annotations rather than only
      # in the dispatch inputs.
      - name: Note the skipped build check
        if: ${{ !inputs.verify }}
        run: echo "::warning::publishing without the makepkg build check (verify=false)"

      # No checkout of the tag: everything published is in the artifact, so a
      # re-run pushes the same bytes `build` produced and checked, rather than
      # recomputing them against a tarball that may since have been re-tagged.
      - name: Download the computed package files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aur-package
          path: aur

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pinned, not trust-on-first-use. Fingerprint
          # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as published in
          # the AUR submission guidelines.
          printf '%s %s %s\n' aur.archlinux.org ssh-ed25519 \
            AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN \
            > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts"

          git clone ssh://aur@aur.archlinux.org/rusted-claude-meter.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --staged --quiet; then
            echo "AUR package unchanged — nothing to publish"
            exit 0
          fi
          git commit -m "Update to ${TAG#v}"
          git push

      # Keep the in-tree copy equal to what was published: the README tells
      # Arch users to makepkg from it, and it takes pkgver off the list of
      # versions a human has to remember to bump.
      - name: Generate GitHub App token (self)
        id: repo-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.REPOSITORY_BUTLER_APP_ID }}
          private-key: ${{ secrets.REPOSITORY_BUTLER_PEM }}

      # Into a sub-path, not `.`: checking out over the working directory would
      # wipe the downloaded artifact this job publishes from.
      - name: Check out main for the sync
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: main-checkout
          token: ${{ steps.repo-token.outputs.token }}
          persist-credentials: false

      - name: Stage the published files onto main
        run: cp aur/PKGBUILD aur/.SRCINFO main-checkout/packaging/aur/

      # sign-commits makes the action build the commit through GitHub's API
      # instead of running `git commit`, so GitHub signs it as the app the
      # token belongs to. Committing with the git CLI here cannot be signed —
      # there is no key on the runner — and lands unverified, which a
      # signed-commits ruleset rejects outright.
      #
      # No changes means no PR, which covers the case where the release did not
      # move the package — and makes a retry of this job idempotent.
      - name: Open the sync PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: main-checkout
          token: ${{ steps.repo-token.outputs.token }}
          sign-commits: true
          base: main
          branch: chore/aur-${{ needs.build.outputs.version }}
          add-paths: packaging/aur/PKGBUILD,packaging/aur/.SRCINFO
          commit-message: "chore(aur): sync packaging/aur to ${{ needs.build.outputs.version }}"
          title: "chore(aur): sync packaging/aur to ${{ needs.build.outputs.version }}"
          body: |
            `pkgver`, `sha256sums` and `.SRCINFO` as published to the AUR for
            ${{ inputs.tag }}, so the in-tree copy matches what
            `yay -S rusted-claude-meter` installs and `makepkg -si` from
            `packaging/aur` keeps working.

            Opened by the `publish` job in `aur.yml`. The AUR is already
            updated at this point — this only re-syncs the repo.
          delete-branch: true
