[package]
name = "rusted-claude-meter"
description = "Claude plan usage meter in your tray — Tauri port of ClaudeMeter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "rusted_claude_meter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Both binaries are declared rather than inferred. `tauri-cli` picks the
# bundle's *main* binary by matching a target name against the package name,
# and its fallback ("if there is exactly one, that is the main one") does not
# fire once there are two — with both inferred, neither would be marked main
# and the bundler would have nothing to build the `.app` around.
[[bin]]
name = "rusted-claude-meter"
path = "src/main.rs"

# The Claude Code status-line bridge (issue #72). Same crate so it is
# versioned, built, bundled and codesigned with the app — tauri-bundler copies
# every `[[bin]]` into `Contents/MacOS/` on macOS and `/usr/bin/` in the
# `.deb`, so it reaches the `.app`, the AppImage and the AUR package with no
# packaging configuration at all. It links nothing from Tauri; see
# `meter-files`' crate docs for why that is the whole point.
[[bin]]
name = "rusted-claude-meter-statusline"
path = "src/bin/statusline.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Default. Automated session import that reads the browser's claude.ai cookie
# store (Chrome/Safari/Firefox) via the `rookie` crate. The "lite" build
# (`--no-default-features`) compiles this — and `rookie` — out entirely, so the
# binary never touches another app's cookie/credential store (the behaviour
# that makes endpoint-protection heuristics, e.g. Cortex XDR, flag the app).
# Manual session-key paste is always available regardless.
default = ["browser-import"]
browser-import = ["dep:rookie"]

[dependencies]
meter-core = { path = "../crates/meter-core" }
meter-api = { path = "../crates/meter-api" }
meter-files = { path = "../crates/meter-files" }
meter-render = { path = "../crates/meter-render" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
keyring-core = "1"
rookie = { version = "0.5", optional = true }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# Native NSPopover for the menu-bar pop-down (macOS only; Linux keeps the tray
# menu). Git-only crate, pinned to the commit that dropped its forked
# `tray-icon` (which would collide with tauri's `tray-icon` feature). Source is
# allow-listed in `deny.toml`.
tauri-plugin-nspopover = { git = "https://github.com/freethinkel/tauri-nspopover-plugin.git", rev = "b571e0e665da7016d967bbf027b92951ac88f78e" }
# Resize the NSPopover to fit its rendered content (bind the popover height to
# what the frontend measures). Same objc2 versions the nspopover plugin
# resolves to, so the `Retained<NSPopover>` it hands back is the type we call
# `setContentSize` on. `setContentSize`/`NSSize` are generated as safe APIs, so
# no `unsafe` is needed (the workspace forbids `unsafe_code`).
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSResponder",
    "NSPopover",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
# `tauri::test::mock_app` — a real `App` (and so the real, `TypeId`-keyed
# managed-state registry) with no windowing runtime, so the wiring in
# `lib.rs::run` can be asserted against the API it actually uses rather than a
# stand-in for it. See `lib.rs`'s managed-state tests (issue #86).
tauri = { version = "2", features = ["test"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
